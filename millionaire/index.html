<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supervision Games</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#354398,#080c28 70%);font:17px system-ui;color:white;min-height:100vh}main{max-width:850px;margin:auto;padding:25px}h1{color:#ffd879;font-size:clamp(32px,6vw,60px)}.card{border:2px solid #b89b60;border-radius:25px;padding:30px;background:#111a49;text-align:center;margin-top:30px;box-shadow:0 25px 70px #0008}button,select{font:inherit;border:1px solid #718bd1;border-radius:12px;padding:14px;background:#27387d;color:white;cursor:pointer}button:hover{filter:brightness(1.25)}button:disabled{opacity:.45;cursor:default}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.good{background:#176f55!important;opacity:1!important}.bad{background:#903553!important}.gold{background:#e8be69;color:#11183d;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.lifelines{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.note{background:#253368;padding:17px;border-radius:12px;margin:20px 0;text-align:left}.ladder{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.ladder span{border:1px solid #718bd1;border-radius:20px;padding:5px 9px;font-size:12px}.current{background:#e8be69;color:#14182d}small{color:#b7c4ee}@media(max-width:600px){.answers{grid-template-columns:1fr}.card{padding:17px}}</style><main id="app"></main><script src="../questions.js"></script><script src="../app.js"></script></html>
